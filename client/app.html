<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream: #f5f0e8;
            --dark: #1a1a2e;
            --accent: #c8973a;
            --accent2: #e8b84b;
            --text: #2d2d2d;
            --muted: #7a7a7a;
            --card: #ffffff;
            --border: #e0d8cc;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(200, 151, 58, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(26, 26, 46, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeDown 0.8s ease both;
        }

        .badge {
            display: inline-block;
            background: var(--dark);
            color: var(--accent2);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 2px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 6vw, 4rem);
            font-weight: 900;
            line-height: 1.1;
            color: var(--dark);
            margin-bottom: 16px;
        }

        h1 span {
            color: var(--accent);
            font-style: italic;
        }

        .subtitle {
            color: var(--muted);
            font-size: 16px;
            font-weight: 300;
            max-width: 420px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Card */
        .card {
            background: var(--card);
            border-radius: 4px;
            border: 1px solid var(--border);
            padding: 48px;
            box-shadow: 0 4px 40px rgba(0,0,0,0.07);
            animation: fadeUp 0.8s 0.2s ease both;
        }

        /* Grid layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-bottom: 32px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .field-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        input[type="number"], select {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 3px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--text);
            background: var(--cream);
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
            -webkit-appearance: none;
            outline: none;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 151, 58, 0.12);
            background: #fff;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            pointer-events: none;
            font-size: 14px;
        }

        /* Toggle buttons for BHK and Bath */
        .toggle-group {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            flex: 1;
            padding: 13px 8px;
            border: 1.5px solid var(--border);
            border-radius: 3px;
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .toggle-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .toggle-btn.active {
            background: var(--dark);
            border-color: var(--dark);
            color: var(--accent2);
        }

        /* Predict button */
        .predict-btn {
            width: 100%;
            padding: 18px;
            background: var(--dark);
            color: var(--accent2);
            border: none;
            border-radius: 3px;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .predict-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(200,151,58,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .predict-btn:hover {
            background: #0f0f1e;
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(26,26,46,0.3);
        }

        .predict-btn:hover::before { opacity: 1; }

        .predict-btn:active { transform: translateY(0); }

        .predict-btn.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        /* Result */
        .result-box {
            margin-top: 32px;
            padding: 32px;
            background: var(--dark);
            border-radius: 4px;
            text-align: center;
            display: none;
            animation: fadeUp 0.5s ease both;
        }

        .result-box.visible { display: block; }

        .result-label {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .result-price {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            color: #fff;
            line-height: 1;
            margin-bottom: 8px;
        }

        .result-price span {
            font-size: 0.4em;
            color: var(--accent2);
            vertical-align: super;
            font-weight: 400;
        }

        .result-note {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            font-weight: 300;
        }

        /* Error */
        .error-box {
            margin-top: 20px;
            padding: 16px 20px;
            background: #fff0f0;
            border: 1px solid #ffcccc;
            border-radius: 3px;
            color: #cc3333;
            font-size: 14px;
            display: none;
        }

        .error-box.visible { display: block; }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 32px 0;
            color: var(--border);
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 13px;
            color: var(--muted);
            animation: fadeUp 0.8s 0.4s ease both;
        }

        /* Animations */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(232,184,75,0.3);
            border-top-color: var(--accent2);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card { padding: 28px 20px; }
            .form-grid { grid-template-columns: 1fr; gap: 24px; }
            .field-group.full-width { grid-column: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">ML Project</div>
            <h1>House Price</span> Predictor</h1>
            <p class="subtitle">Enter property details below to get an estimated market price powered by machine learning.</p>
        </header>

        <div class="card">
            <div class="form-grid">

                <!-- Square Feet -->
                <div class="field-group">
                    <label>Total Area (sq ft)</label>
                    <input type="number" id="sqft" placeholder="e.g. 1200" min="100" max="10000">
                </div>

                <!-- Location -->
                <div class="field-group">
                    <label>Location</label>
                    <div class="select-wrapper">
                        <select id="location">
                            <option value="">Loading locations...</option>
                        </select>
                    </div>
                </div>

                <!-- BHK -->
                <div class="field-group">
                    <label>BHK (Bedrooms)</label>
                    <div class="toggle-group" id="bhk-group">
                        <button class="toggle-btn" data-value="1">1</button>
                        <button class="toggle-btn active" data-value="2">2</button>
                        <button class="toggle-btn" data-value="3">3</button>
                        <button class="toggle-btn" data-value="4">4</button>
                        <button class="toggle-btn" data-value="5">5</button>
                    </div>
                </div>

                <!-- Bathrooms -->
                <div class="field-group">
                    <label>Bathrooms</label>
                    <div class="toggle-group" id="bath-group">
                        <button class="toggle-btn" data-value="1">1</button>
                        <button class="toggle-btn active" data-value="2">2</button>
                        <button class="toggle-btn" data-value="3">3</button>
                        <button class="toggle-btn" data-value="4">4</button>
                        <button class="toggle-btn" data-value="5">5</button>
                    </div>
                </div>

            </div>

            <button class="predict-btn" id="predict-btn" onclick="predictPrice()">
                Estimate Price
            </button>

            <div class="error-box" id="error-box"></div>

            <div class="result-box" id="result-box">
                <div class="result-label">Estimated Market Price</div>
                <div class="result-price" id="result-price">
                    <span>₹</span><span id="price-value">--</span>
                </div>
                <div class="result-note">Lakhs · Based on current market data</div>
            </div>
        </div>

        <footer>
            Built with Python · Flask · Scikit-learn · Linear Regression
        </footer>
    </div>

    <script>
        const SERVER_URL = 'https://touseefahmedpythonanywhere.pythonanywhere.com';

        // Selected values
        let selectedBhk = 2;
        let selectedBath = 2;

        // Toggle button logic
        function setupToggle(groupId, callback) {
            const group = document.getElementById(groupId);
            group.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    callback(parseInt(btn.dataset.value));
                });
            });
        }

        setupToggle('bhk-group', val => selectedBhk = val);
        setupToggle('bath-group', val => selectedBath = val);

        // Load locations on page load
        async function loadLocations() {
            try {
                const res = await fetch(`${SERVER_URL}/get_location_names`);
                const data = await res.json();
                const select = document.getElementById('location');
                select.innerHTML = '<option value="">Select a location</option>';
                data.locations.forEach(loc => {
                    const opt = document.createElement('option');
                    opt.value = loc;
                    opt.textContent = loc.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                    select.appendChild(opt);
                });
            } catch (err) {
                document.getElementById('location').innerHTML = '<option value="">Could not load locations</option>';
            }
        }

        // Predict price
        async function predictPrice() {
            const sqft = document.getElementById('sqft').value;
            const location = document.getElementById('location').value;
            const errorBox = document.getElementById('error-box');
            const resultBox = document.getElementById('result-box');
            const btn = document.getElementById('predict-btn');

            // Hide previous results
            errorBox.classList.remove('visible');
            resultBox.classList.remove('visible');

            // Validate
            if (!sqft || sqft < 100) {
                showError('Please enter a valid area (minimum 100 sq ft).');
                return;
            }
            if (!location) {
                showError('Please select a location.');
                return;
            }

            // Loading state
            btn.classList.add('loading');
            btn.innerHTML = '<span class="spinner"></span> Calculating...';

            try {
                const formData = new FormData();
                formData.append('total_sqft', sqft);
                formData.append('location', location);
                formData.append('bhk', selectedBhk);
                formData.append('bath', selectedBath);

                const res = await fetch(`${SERVER_URL}/predict_home_price`, {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                document.getElementById('price-value').textContent = data.estimated_price.toFixed(2);
                resultBox.classList.add('visible');

            } catch (err) {
                showError('Could not connect to server. Make sure your Flask server is running on port 5000.');
            } finally {
                btn.classList.remove('loading');
                btn.innerHTML = 'Estimate Price';
            }
        }

        function showError(msg) {
            const box = document.getElementById('error-box');
            box.textContent = msg;
            box.classList.add('visible');
        }

        // Init
        loadLocations();
    </script>
</body>
</html>
