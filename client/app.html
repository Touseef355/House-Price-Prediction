<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>House Price Predictor</h1>
            <p class="subtitle">Estimate the market value of any property in Bangalore.</p>
        </header>

        <div class="card">
            <div class="form-grid">

                <div class="field-group">
                    <label for="sqft">Total Area (sq ft)</label>
                    <input type="number" id="sqft" placeholder="e.g. 1200" min="100" max="10000">
                </div>

                <div class="field-group">
                    <label for="location">Location</label>
                    <div class="select-wrapper">
                        <select id="location">
                            <option value="">Loading locations...</option>
                        </select>
                    </div>
                </div>

                <div class="field-group">
                    <label>BHK (Bedrooms)</label>
                    <div class="toggle-group" id="bhk-group">
                        <button class="toggle-btn" data-value="1">1</button>
                        <button class="toggle-btn active" data-value="2">2</button>
                        <button class="toggle-btn" data-value="3">3</button>
                        <button class="toggle-btn" data-value="4">4</button>
                        <button class="toggle-btn" data-value="5">5</button>
                    </div>
                </div>

                <div class="field-group">
                    <label>Bathrooms</label>
                    <div class="toggle-group" id="bath-group">
                        <button class="toggle-btn" data-value="1">1</button>
                        <button class="toggle-btn active" data-value="2">2</button>
                        <button class="toggle-btn" data-value="3">3</button>
                        <button class="toggle-btn" data-value="4">4</button>
                        <button class="toggle-btn" data-value="5">5</button>
                    </div>
                </div>

            </div>

            <button class="predict-btn" id="predict-btn" onclick="predictPrice()">
                Estimate Price
            </button>

            <div class="error-box" id="error-box"></div>

            <div class="result-box" id="result-box">
                <p class="result-label">Estimated Market Price</p>

                <!-- Primary: large readable price -->
                <p class="result-primary" id="result-primary">—</p>

                <!-- Secondary breakdown row -->
                <div class="result-breakdown" id="result-breakdown">
                    <div class="breakdown-item">
                        <span class="breakdown-label">In Lakhs</span>
                        <span class="breakdown-value" id="val-lakhs">—</span>
                    </div>
                    <div class="breakdown-divider"></div>
                    <div class="breakdown-item">
                        <span class="breakdown-label">In Crores</span>
                        <span class="breakdown-value" id="val-crores">—</span>
                    </div>
                    <div class="breakdown-divider"></div>
                    <div class="breakdown-item">
                        <span class="breakdown-label">Full amount</span>
                        <span class="breakdown-value" id="val-full">—</span>
                    </div>
                </div>

                <p class="result-note">Estimated value · Bangalore market · Model accuracy ±10–15%</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
